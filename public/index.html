<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Clawd</title>
  <meta name="theme-color" content="#d77757">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon-192.png">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="menu">
    <button type="button" class="menu-button" aria-label="Menu" aria-expanded="false" aria-controls="menu-nav">
      <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
        <path d="M2 4h12M2 8h12M2 12h12" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
      </svg>
    </button>
    <nav id="menu-nav" hidden>
      <a href="#/" data-view="live">Live</a>
      <a href="#/demo" data-view="demo">Démo</a>
      <a href="#/galerie" data-view="galerie">Galerie</a>
      <fieldset class="setting">
        <legend>Décor</legend>
        <label><input type="radio" name="decor" value="none"> Aucun</label>
        <label><input type="radio" name="decor" value="open-space"> Avec</label>
        <label><input type="radio" name="decor" value="chantier"> Chantier <small>(la session construit sa salle)</small></label>
      </fieldset>
      <fieldset class="setting inline" data-needs-bare>
        <legend>Un bureau par Clawd</legend>
        <label><input type="radio" name="desk" value="off"> Non</label>
        <label><input type="radio" name="desk" value="on"> Oui</label>
      </fieldset>
      <fieldset class="setting" data-needs-decor>
        <legend>Disposition</legend>
        <label><input type="radio" name="layout" value="rooms"> Salles</label>
        <label><input type="radio" name="layout" value="shared"> Open space partagé</label>
      </fieldset>
      <fieldset class="setting" data-needs-decor>
        <legend>Extérieur</legend>
        <label><input type="radio" name="outside" value="random"> Au hasard <small>(un par jour)</small></label>
        <label><input type="radio" name="outside" value="none"> Aucun</label>
        <label><input type="radio" name="outside" value="ville"> Ville</label>
        <label><input type="radio" name="outside" value="village"> Village</label>
        <label><input type="radio" name="outside" value="campagne"> Campagne</label>
        <label><input type="radio" name="outside" value="mer"> Bord de mer</label>
        <label><input type="radio" name="outside" value="espace"> Vaisseau spatial</label>
      </fieldset>
      <fieldset class="setting inline">
        <legend>Taille des pixels</legend>
        <label><input type="radio" name="px" value="1"> 1</label>
        <label><input type="radio" name="px" value="2"> 2</label>
        <label><input type="radio" name="px" value="3"> 3</label>
        <label><input type="radio" name="px" value="4"> 4</label>
        <label><input type="radio" name="px" value="5"> 5</label>
        <label><input type="radio" name="px" value="6"> 6</label>
      </fieldset>
      <fieldset class="setting inline" data-notify>
        <legend>Notifier quand un agent attend</legend>
        <label><input type="radio" name="notify" value="off"> Non</label>
        <label><input type="radio" name="notify" value="on"> Oui</label>
      </fieldset>
    </nav>
  </div>

  <section id="live" class="scene" hidden></section>
  <section id="demo" class="scene" hidden></section>
  <section id="gallery" hidden>
    <p class="intro">Toutes les animations, regroupées par activité de l'agent. À gauche le Clawd du main, à droite celui d'un subagent.</p>
  </section>

  <script type="module" src="/app.js"></script>
</body>
</html>
