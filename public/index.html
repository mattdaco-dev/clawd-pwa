<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Clawd</title>
  <meta name="theme-color" content="#d77757">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon-192.png">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="menu">
    <button type="button" class="menu-button" aria-label="Menu" aria-expanded="false" aria-controls="menu-nav">
      <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
        <path d="M2 4h12M2 8h12M2 12h12" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
      </svg>
    </button>
    <nav id="menu-nav" hidden>
      <a href="#/" data-view="live">Live</a>
      <a href="#/demo" data-view="demo">Demo</a>
      <a href="#/gallery" data-view="gallery">Gallery</a>
      <button type="button" class="detach" hidden>Detach Live</button>
      <fieldset class="setting">
        <legend>Backdrop</legend>
        <label><input type="radio" name="decor" value="none"> None</label>
        <label><input type="radio" name="decor" value="open-space"> Office</label>
      </fieldset>
      <fieldset class="setting inline" data-needs-bare>
        <legend>A desk per Clawd</legend>
        <label><input type="radio" name="desk" value="off"> No</label>
        <label><input type="radio" name="desk" value="on"> Yes</label>
      </fieldset>
      <fieldset class="setting" data-needs-decor>
        <legend>Layout</legend>
        <label><input type="radio" name="layout" value="rooms"> Rooms</label>
        <label><input type="radio" name="layout" value="shared"> Shared open space</label>
      </fieldset>
      <fieldset class="setting" data-needs-decor>
        <legend>Outside</legend>
        <label><input type="radio" name="outside" value="random"> Random <small>(one a day)</small></label>
        <label><input type="radio" name="outside" value="none"> None</label>
        <label><input type="radio" name="outside" value="ville"> City</label>
        <label><input type="radio" name="outside" value="village"> Village</label>
        <label><input type="radio" name="outside" value="campagne"> Countryside</label>
        <label><input type="radio" name="outside" value="mer"> Seaside</label>
        <label><input type="radio" name="outside" value="espace"> Spaceship</label>
      </fieldset>
      <fieldset class="setting inline">
        <legend>Pixel size</legend>
        <label><input type="radio" name="px" value="1"> 1</label>
        <label><input type="radio" name="px" value="2"> 2</label>
        <label><input type="radio" name="px" value="3"> 3</label>
        <label><input type="radio" name="px" value="4"> 4</label>
        <label><input type="radio" name="px" value="5"> 5</label>
        <label><input type="radio" name="px" value="6"> 6</label>
      </fieldset>
      <fieldset class="setting inline" data-notify>
        <legend>Notify when an agent is waiting</legend>
        <label><input type="radio" name="notify" value="off"> No</label>
        <label><input type="radio" name="notify" value="on"> Yes</label>
      </fieldset>
    </nav>
  </div>

  <section id="live" class="scene" hidden></section>
  <section id="detached" class="scene detached" hidden>
    <p>Live is in a floating window.</p>
    <button type="button" class="reattach">Bring it back here</button>
  </section>
  <section id="demo" class="scene" hidden></section>
  <section id="gallery" hidden>
    <p class="intro">Every animation, grouped by agent activity. On the left the main agent's Clawd, on the right a subagent's.</p>
  </section>

  <script type="module" src="/app.js"></script>
</body>
</html>
